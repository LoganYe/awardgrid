name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    env:
      # Tests must pass with no network and no keys (Definition of done).
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build the pruned toolkit plugin (so the plugin-dependent gate tests run)
        run: pnpm build:plugin

      - name: Test (fixtures only, no network)
        run: pnpm test

      # One owner per capture (#34): every PNG under docs/screenshots/v0.2/** outside the frozen
      # before/ is declared in e2e/matrix.ts and written by e2e/screenshots.spec.ts. This reads
      # the COMMITTED tree only — no browser, no build — and fails on a capture the matrix does
      # not declare, a name that breaks the §9 rule, or a declared state with no PNG on disk.
      - name: Screenshots — every capture is declared in the matrix
        run: pnpm exec tsx scripts/screenshot-index.ts --strict --check

      # Kickoff §9 Phase-2 self-acceptance: no key material in client bundles — build the app and grep
      # the whole .next/ output (client chunks + standalone server tree) for the fixture/seed key strings.
      - name: Build + no fixture keys in .next output
        run: |
          pnpm exec next build
          bash scripts/check-no-secrets-in-bundle.sh

      - name: No secrets or databases tracked
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)\.env(\.[^/]*)?$|\.(db|sqlite|sqlite3|db-wal|db-shm)$' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "Tracked files that must never be committed:"; echo "$bad"; exit 1
          fi
          echo "OK: no .env or SQLite files tracked"

  # The static site (sites/landing) as it is deployed, and the public-claims gate over it. The gate reads the built
  # pages (their text, comments, scripts, attribution links and JSON-LD) and the registered public files against
  # growth/product-facts.json, at the release status the registry records; its other status modes are covered by its
  # tests. Each check is its own step, and the tests run with the verbose reporter, so the log names every test that
  # ran rather than only a green tick. The two test steps build nothing into dist/ and still run when the build or
  # the gate fails, so a red run shows them too.
  landing:
    name: landing site · public-claims gate
    runs-on: ubuntu-latest
    env:
      # Tests must pass with no network and no keys (Definition of done).
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - id: install
        run: pnpm install --frozen-lockfile

      # A placeholder address: the build refuses to run without one (sites/landing/vite.config.ts).
      - name: Build the landing site
        run: AWARDGRID_SUPPORT_EMAIL=support@example.com pnpm build:landing

      - name: Public-claims gate on the built site (the registry's release status)
        run: node scripts/growth/validate-public-claims.mjs --dist sites/landing/dist

      - name: No HTML comment in the built pages
        run: |
          set -euo pipefail
          grep -rc '<!--' sites/landing/dist --include='*.html' || true
          if grep -rq '<!--' sites/landing/dist --include='*.html'; then
            echo "HTML comments found in sites/landing/dist"; exit 1
          fi
          echo "OK: no HTML comment in sites/landing/dist"

      # `pnpm --filter … test -- --reporter=verbose` hands vitest a literal `--`, after which vitest ignores the flag,
      # and pnpm reads a bare `--reporter` as its own option; `exec` passes it through to vitest.
      - name: Landing tests (the built pages, comment stripping, root and publicDir)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @awardgrid/landing exec vitest run --reporter=verbose

      - name: Public-claims gate tests (every rule, each release status, today's pages)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec vitest run scripts/growth --reporter=verbose

      # The App Store listing (apps/ios/store-metadata): the next version's drafts under next/, strictly (a warning
      # fails too), and the tests of the ASO tools, verbose so the log names each one. The runner's own python3 and the
      # standard library only; the name check's tests mock the network. Neither needs the build, so both run when it
      # fails.
      - name: Store metadata validator (apps/ios/store-metadata/next, strict)
        if: ${{ !cancelled() }}
        run: python3 scripts/aso/validate_metadata.py --strict

      - name: ASO tool tests (metadata validator and name check)
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s scripts/aso -p 'test_*.py' -v

  e2e:
    name: e2e (Playwright, demo mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: CJK fonts for zh screenshots
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
      - name: Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Build the pruned toolkit plugin
        run: pnpm build:plugin
      - name: Build
        run: pnpm build
      - name: e2e (no network, no keys)
        run: pnpm e2e
      - name: Upload report and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e-report
            test-results
          retention-days: 7

  # Spec §9 / §11: visual regression was non-blocking until it had been green five runs in a row.
  # It has been (2026-09-07, issue #33): 96eef58, caa4ac6, 8fcfe5a, 403dd91, 06d4476, each
  # 24 passed / 0 failed. The comparison step is BLOCKING now; the promotion is recorded in
  # DECISIONS 6.6 with those run ids. `continue-on-error` survives only on the generate path
  # below, which is a one-off bootstrap and must not block.
  #
  # Baselines are Linux-only: playwright.config.ts writes them without a platform suffix, so they
  # can only be generated here. When none are committed yet, the last two steps generate a set and
  # upload it as `visual-baselines` for a human to download and commit
  # (`e2e/__screenshots__/<project>/visual.spec.ts/*.png`, reason in the commit message).
  visual:
    name: visual (Playwright snapshots)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: CJK fonts for zh screenshots
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
      - name: Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Build the pruned toolkit plugin
        run: pnpm build:plugin
      - name: Build
        run: pnpm build

      - name: Are there committed baselines?
        id: baselines
        run: |
          set -euo pipefail
          if compgen -G "e2e/__screenshots__/*/visual.spec.ts/*.png" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No committed baselines under e2e/__screenshots__ — this run will generate them."
          fi

      # Blocking as of 2026-09-07 (issue #33): five consecutive green comparisons on main —
      # 96eef58, caa4ac6, 8fcfe5a, 403dd91, 06d4476, each 24 passed / 0 failed. `continue-on-error`
      # is gone, so a pixel diff now turns this job red instead of being buried in its log; the
      # artifact below is still uploaded on failure and is the evidence to read before deciding
      # whether to fix the UI or move the baseline.
      - name: Visual regression (VISUAL=1, no network, no keys)
        if: steps.baselines.outputs.present == 'true'
        run: VISUAL=1 pnpm e2e -g visual

      - name: Upload actual and diff images
        if: always() && steps.baselines.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: visual-snapshots
          path: |
            e2e/__screenshots__
            test-results
          if-no-files-found: ignore
          retention-days: 7

      # No baselines yet: generate the Linux set so it can be downloaded and committed once.
      - name: Generate Linux baselines
        if: steps.baselines.outputs.present != 'true'
        continue-on-error: true
        run: VISUAL=1 pnpm e2e:update -g visual

      - name: Upload the generated baselines
        if: always() && steps.baselines.outputs.present != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: e2e/__screenshots__
          if-no-files-found: warn
          retention-days: 7

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-smoke:
    name: docker smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true   # build:plugin reads vendor/travel-hacking-toolkit

      - name: Throwaway .env (parser / ask lanes are never called by this smoke)
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i "s|^MASTER_KEY=.*|MASTER_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^ANTHROPIC_API_KEY=.*|ANTHROPIC_API_KEY=ci-placeholder|" .env
          grep -q '^MASTER_KEY=[0-9a-f]\{64\}$' .env
          grep -q '^ANTHROPIC_API_KEY=ci-placeholder$' .env

      - name: docker compose build
        run: docker compose build

      # `up -d` with NO service name, deliberately: it is the only thing that starts the worker
      # container, and until #11 that container had never run anywhere — not in CI, not locally.
      # The worker's `depends_on: condition: service_healthy` makes this block until the app's
      # HEALTHCHECK passes, so the /api/health poll below cannot race it.
      - name: docker compose up -d (app AND worker)
        run: docker compose up -d

      - name: Wait for /api/health (up to 60 s)
        run: |
          set -uo pipefail
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health || true)
            if [ "$code" = "200" ]; then echo "healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "app did not become healthy within 60 s (last status: ${code:-none})"
          exit 1

      - name: /login renders (HTTP 200)
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login)
          echo "/login -> $code"
          [ "$code" = "200" ]

      # The worker is the surface nothing else tests. If tsx-in-the-runtime-image, the worker
      # command line or the /data volume permissions were wrong, the app would serve the grid
      # perfectly and no standing query would ever run — a failure nobody notices for days.
      # `worker.start` is the last line of a successful boot (src/cli/worker-main.ts:162).
      - name: Worker booted, on the mock transport (up to 60 s)
        run: |
          set -uo pipefail
          # One JSON line proves both: stdoutLog writes
          #   {"ts":…,"event":"worker.start","tickCron":…,"transport":"mock"}
          # and it is the last thing a successful boot emits (src/cli/worker-main.ts:162).
          # "mock" rather than "telegram" is the assertion that CI has no bot token, which is
          # what keeps this smoke from ever sending a real message.
          for i in $(seq 1 60); do
            if docker compose logs worker 2>/dev/null | grep -q '"event":"worker.start"'; then
              echo "worker booted after ${i}s"
              docker compose logs worker --tail 20
              docker compose logs worker | grep '"event":"worker.start"' | grep -q '"transport":"mock"'
              exit $?
            fi
            sleep 1
          done
          echo "worker never logged worker.start within 60 s"
          docker compose logs worker --tail 50
          exit 1

      - name: App and worker logs (on failure)
        if: failure()
        run: |
          echo '--- app ---';    docker compose logs app --tail 50
          echo '--- worker ---'; docker compose logs worker --tail 50

      - name: docker compose down -v
        if: always()
        run: docker compose down -v
