name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    env:
      # Tests must pass with no network and no keys (Definition of done).
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build the pruned toolkit plugin (so the plugin-dependent gate tests run)
        run: pnpm build:plugin

      - name: Test (fixtures only, no network)
        run: pnpm test

      # Kickoff §9 Phase-2 self-acceptance: no key material in client bundles — build the app and grep
      # the whole .next/ output (client chunks + standalone server tree) for the fixture/seed key strings.
      - name: Build + no fixture keys in .next output
        run: |
          pnpm exec next build
          bash scripts/check-no-secrets-in-bundle.sh

      - name: No secrets or databases tracked
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)\.env(\.[^/]*)?$|\.(db|sqlite|sqlite3|db-wal|db-shm)$' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "Tracked files that must never be committed:"; echo "$bad"; exit 1
          fi
          echo "OK: no .env or SQLite files tracked"

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-smoke:
    name: docker smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true   # build:plugin reads vendor/travel-hacking-toolkit

      - name: Throwaway .env (parser / ask lanes are never called by this smoke)
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i "s|^MASTER_KEY=.*|MASTER_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^ANTHROPIC_API_KEY=.*|ANTHROPIC_API_KEY=ci-placeholder|" .env
          grep -q '^MASTER_KEY=[0-9a-f]\{64\}$' .env
          grep -q '^ANTHROPIC_API_KEY=ci-placeholder$' .env

      - name: docker compose build
        run: docker compose build

      - name: docker compose up -d app
        run: docker compose up -d app

      - name: Wait for /api/health (up to 60 s)
        run: |
          set -uo pipefail
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health || true)
            if [ "$code" = "200" ]; then echo "healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "app did not become healthy within 60 s (last status: ${code:-none})"
          exit 1

      - name: /login renders (HTTP 200)
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login)
          echo "/login -> $code"
          [ "$code" = "200" ]

      - name: App logs (on failure)
        if: failure()
        run: docker compose logs app --tail 50

      - name: docker compose down -v
        if: always()
        run: docker compose down -v
