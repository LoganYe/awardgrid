# The repo became a real workspace in Phase 1 of the client-app pivot (docs/PIVOT.md §6):
# `packages/core` is the runtime-independent core every shell consumes. Until then this file
# carried only `allowBuilds` and had no `packages:` key, so nothing was actually linked.
packages:
  - "."
  - "packages/*"
  # Shells. apps/ios is the Capacitor client (docs/PIVOT.md §6 Phase 2); more may follow
  # (desktop, extension). Each consumes @awardgrid/core and owns no core logic of its own.
  - "apps/*"
  # The static landing site (docs/PIVOT.md §2). It consumes @awardgrid/tokens and nothing else.
  - "sites/*"

allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: false
  unrs-resolver: false
